name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run opt-in MCP/SDK E2E checks after the full gate"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run release gate
        if: github.event_name == 'pull_request'
        shell: powershell
        run: .\scripts\release-gate.ps1 -AssertClean

      - name: Run full release gate
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          LORE_LLM_BASE_URL: ${{ secrets.LORE_LLM_BASE_URL }}
          LORE_LLM_API_KEY: ${{ secrets.LORE_LLM_API_KEY }}
          LORE_LLM_MODEL: ${{ vars.LORE_LLM_MODEL }}
        run: |
          if (-not $env:LORE_LLM_BASE_URL -or -not $env:LORE_LLM_API_KEY -or -not $env:LORE_LLM_MODEL) {
              throw "Full release gate requires LORE_LLM_BASE_URL, LORE_LLM_API_KEY, and LORE_LLM_MODEL"
          }
          $args = @("-Full")
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.e2e }}" -eq "true") {
              $args += "-E2E"
          }
          $args += "-AssertClean"
          .\scripts\release-gate.ps1 @args

      - name: Assert release gate leaves repo clean
        if: always()
        shell: powershell
        run: |
          if (Test-Path -LiteralPath ".smoke-workdir") {
              throw ".smoke-workdir was created in the repository"
          }
          $dirty = git status --short
          if ($dirty) {
              $dirty
              throw "release gate left the worktree dirty"
          }
